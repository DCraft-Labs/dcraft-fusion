apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: dcraft-fusion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          # v1.3.9 §3: AOF+RDB under /data so restarts reload Streams state.
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 2Gi
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: dcraft-fusion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # v1.3.9: raised from 512Mi — Streams + AOF need headroom under CDC load.
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: dcraft-fusion
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
