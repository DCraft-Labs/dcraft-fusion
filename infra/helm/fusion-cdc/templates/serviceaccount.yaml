{{- if .Values.controlPlane.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fusion-cdc.controlPlane.serviceAccountName" . }}
  labels:
    {{- include "fusion-cdc.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  {{- with .Values.controlPlane.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
  v1.3.7 Bug #5: committer_provisioner.py calls
  kubernetes.config.load_incluster_config(), which requires the projected
  SA token file to exist in the control-plane pod. Default values flip
  automount to true; honor an explicit override here.
*/}}
automountServiceAccountToken: {{ .Values.controlPlane.serviceAccount.automountServiceAccountToken }}
{{- end }}
---
{{- if .Values.cdcWorkers.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fusion-cdc.cdcWorkers.serviceAccountName" . }}
  labels:
    {{- include "fusion-cdc.labels" . | nindent 4 }}
    app.kubernetes.io/component: cdc-worker
  {{- with .Values.cdcWorkers.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.cdcWorkers.serviceAccount.automountServiceAccountToken }}
{{- end }}
---
{{- if .Values.frontend.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fusion-cdc.frontend.serviceAccountName" . }}
  labels:
    {{- include "fusion-cdc.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  {{- with .Values.frontend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.frontend.serviceAccount.automountServiceAccountToken }}
{{- end }}
---
{{- if .Values.controlPlane.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fusion-cdc.fullname" . }}-control-plane-role
  labels:
    {{- include "fusion-cdc.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{/*
    Dynamic per-connection Iceberg committer provisioning
    (control-plane committer_provisioner.py) — creates/updates/deletes the
    committer Deployment + catalog-config Secret + headless metrics Service.
  */}}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fusion-cdc.fullname" . }}-control-plane-binding
  labels:
    {{- include "fusion-cdc.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
subjects:
  - kind: ServiceAccount
    name: {{ include "fusion-cdc.controlPlane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "fusion-cdc.fullname" . }}-control-plane-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
